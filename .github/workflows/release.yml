name: Build Release APK

# 触发：推送 v* 标签时构建并发布 Release；也可在 Actions 页面手动触发（手动触发同样发布 Release）。
# 版本号在 app/build.gradle.kts 中手动维护，发布标签必须与该版本一致。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release 标签名（须匹配手动版本；留空使用当前版本，如 v1.1.0）'
        required: false
        default: ''

# Release 附件和 Actions artifact 分别使用独立权限与接口。
permissions:
  contents: write
  actions: write

# 串行构建，防止旧产物清理误删另一次正在上传的安装包。
concurrency:
  group: release-apk
  cancel-in-progress: false

jobs:
  build:
    name: 签名构建
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 读取手动版本号
        env:
          REF_TYPE: ${{ github.ref_type }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          VERSION=$(grep -oP '^\s*versionName\s*=\s*"\K[^" ]+' app/build.gradle.kts | head -1)
          VCODE=$(grep -oP '^\s*versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts | head -1)
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ && "$VCODE" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::请在 app/build.gradle.kts 中填写有效的 versionName 和 versionCode"
            exit 1
          fi
          if [ "$REF_TYPE" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="${INPUT_TAG:-v$VERSION}"
          fi
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::发布标签 $TAG 与手动版本 $VERSION 不一致，请使用 v$VERSION"
            exit 1
          fi
          echo "构建版本：$VERSION (versionCode=$VCODE)"
          echo "REL_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "REL_TAG=$TAG" >> "$GITHUB_ENV"

      - name: 读取本版本更新日志
        run: |
          python3 .github/scripts/extract-release-notes.py "$REL_VERSION" "$RUNNER_TEMP/release-notes.md"

      - name: 清理旧 Actions 安装包
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {
              owner, repo, name: 'LinuxSB-apk', per_page: 100,
            });
            for (const artifact of artifacts) {
              if (artifact.name !== 'LinuxSB-apk' || !artifact.workflow_run ||
                  artifact.workflow_run.id === context.runId) continue;
              try {
                await github.rest.actions.deleteArtifact({ owner, repo, artifact_id: artifact.id });
                core.info(`已删除旧 Actions 安装包：${artifact.id}`);
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }
            // 仅删除 Actions artifact；不调用 Release 或 release assets 删除接口。

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Gradle（含缓存）
        uses: gradle/actions/setup-gradle@v4

      # 签名材料来自仓库 Secrets（不入库）：
      # LSB_KEYSTORE_BASE64 —— keystore 文件内容的 base64
      # LSB_STORE_PASSWORD / LSB_KEY_ALIAS / LSB_KEY_PASSWORD —— 口令与别名
      - name: 还原 keystore
        env:
          LSB_KEYSTORE_BASE64: ${{ secrets.LSB_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$LSB_KEYSTORE_BASE64" ]; then
            echo "::error::缺少 Secret LSB_KEYSTORE_BASE64，请先在仓库 Settings → Secrets → Actions 中配置"
            exit 1
          fi
          printf '%s' "$LSB_KEYSTORE_BASE64" | tr -d '\r\n \t' | base64 --decode > "$RUNNER_TEMP/lsb-release.jks"
          test -s "$RUNNER_TEMP/lsb-release.jks" || { echo "::error::keystore 解码结果为空"; exit 1; }

      - name: 构建签名 APK
        env:
          LSB_STORE_PASSWORD: ${{ secrets.LSB_STORE_PASSWORD }}
          LSB_KEY_ALIAS: ${{ secrets.LSB_KEY_ALIAS }}
          LSB_KEY_PASSWORD: ${{ secrets.LSB_KEY_PASSWORD }}
        run: |
          # 兜底：Windows 提交可能丢失 gradlew 执行位（exit 126）
          chmod +x gradlew
          ./gradlew assembleRelease \
            -PLSB_STORE_FILE="$RUNNER_TEMP/lsb-release.jks" \
            --no-daemon --stacktrace

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: LinuxSB-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          overwrite: true

      # 创建 GitHub Release 并附带三个 ABI 的 APK：
      # - 标签触发：直接用推送的标签名
      # - 手动触发：用已校验的 tag，并在当前 commit 上补建标签
      - name: 发布 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          EXTRA_ARGS=()
          if [ "$REF_TYPE" != "tag" ]; then
            EXTRA_ARGS=(--target "$GITHUB_SHA")
          fi
          echo "发布 Release：$REL_TAG"
          if gh release view "$REL_TAG" > /dev/null 2>&1; then
            echo "::error::Release $REL_TAG 已存在，请手动更新版本号后使用新的匹配标签"
            exit 1
          fi
          gh release create "$REL_TAG" \
            app/build/outputs/apk/release/*.apk \
            --title "LinuxSB $REL_TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            "${EXTRA_ARGS[@]}"
