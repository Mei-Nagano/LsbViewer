name: Build Release APK

# 触发：推送 v* 标签时构建并发布 Release；也可在 Actions 页面手动触发（手动触发同样发布 Release）
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release 标签名（留空则自动使用 build.gradle.kts 的 versionName，如 v1.0.0）'
        required: false
        default: ''

# 创建 Release 需要仓库写入权限
permissions:
  contents: write

jobs:
  build:
    name: 签名构建
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Gradle（含缓存）
        uses: gradle/actions/setup-gradle@v4

      # 签名材料来自仓库 Secrets（不入库）：
      # LSB_KEYSTORE_BASE64 —— keystore 文件内容的 base64
      # LSB_STORE_PASSWORD / LSB_KEY_ALIAS / LSB_KEY_PASSWORD —— 口令与别名
      - name: 还原 keystore
        env:
          LSB_KEYSTORE_BASE64: ${{ secrets.LSB_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$LSB_KEYSTORE_BASE64" ]; then
            echo "::error::缺少 Secret LSB_KEYSTORE_BASE64，请先在仓库 Settings → Secrets → Actions 中配置"
            exit 1
          fi
          printf '%s' "$LSB_KEYSTORE_BASE64" | tr -d '\r\n \t' | base64 --decode > "$RUNNER_TEMP/lsb-release.jks"
          test -s "$RUNNER_TEMP/lsb-release.jks" || { echo "::error::keystore 解码结果为空"; exit 1; }

      - name: 构建签名 APK
        env:
          LSB_STORE_PASSWORD: ${{ secrets.LSB_STORE_PASSWORD }}
          LSB_KEY_ALIAS: ${{ secrets.LSB_KEY_ALIAS }}
          LSB_KEY_PASSWORD: ${{ secrets.LSB_KEY_PASSWORD }}
        run: |
          # 兜底：Windows 提交可能丢失 gradlew 执行位（exit 126）
          chmod +x gradlew
          ./gradlew assembleRelease \
            -PLSB_STORE_FILE="$RUNNER_TEMP/lsb-release.jks" \
            --no-daemon --stacktrace

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: LinuxSB-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # 创建 GitHub Release 并附带三个 ABI 的 APK：
      # - 标签触发：直接用推送的标签名
      # - 手动触发：用输入的 tag（留空则读 build.gradle.kts 的 versionName 拼成 vX.Y.Z），并在当前 commit 上补建标签
      - name: 发布 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
            EXTRA_ARGS=""
          else
            TAG="${{ github.event.inputs.tag }}"
            if [ -z "$TAG" ]; then
              VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
              TAG="v$VERSION"
            fi
            EXTRA_ARGS="--target $GITHUB_SHA"
          fi
          echo "发布 Release：$TAG"
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "::error::Release $TAG 已存在，如需重发请先删除或换一个标签"
            exit 1
          fi
          gh release create "$TAG" \
            app/build/outputs/apk/release/*.apk \
            --title "LinuxSB $TAG" \
            --generate-notes \
            $EXTRA_ARGS
